plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reminderoverlay'
version = '1.0.0'

android {
  namespace "expo.modules.reminderoverlay"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Fused location for ArrivalWatchService (same version expo-location ships).
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  // LinkExpander (React Native already ships this version).
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
