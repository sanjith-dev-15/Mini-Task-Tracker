name: Android Release APK

# Builds a signed release APK every time code lands on `main` and publishes it
# to a rolling GitHub Release (tag: android-latest).
#
# One-time setup — add these repo secrets
# (Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret):
#   ANDROID_KEYSTORE_BASE64    base64 of your release.keystore file
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# Generate the keystore once (back up the file + passwords — losing them means
# users can no longer update-install over an existing build):
#   keytool -genkeypair -v -keystore release.keystore -alias goku \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -storepass '<STORE_PW>' -keypass '<KEY_PW>' -dname "CN=Goku,O=NIGO,C=IN"
#   base64 -w0 release.keystore    # value for ANDROID_KEYSTORE_BASE64 (Linux/macOS)
#   # PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore"))
#
# The release signing config itself is injected at prebuild time by
# plugins/withReleaseSigning.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Set Android versionCode to run number
        run: |
          node -e '
            const fs = require("fs");
            const p = "app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("expo.android.versionCode =", j.expo.android.versionCode);
          '

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Show generated version
        run: grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty"; exit 1; }

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Verify APK is signed with the release key
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | head -n 5

      - name: Prepare APK
        id: apk
        run: |
          set -e
          version=$(node -p "require('./app.json').expo.version")
          src=android/app/build/outputs/apk/release/app-release.apk
          dest="Goku-v${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated build from `main` @ ${{ github.sha }}

            - App version: **${{ steps.apk.outputs.version }}** (versionCode ${{ github.run_number }})
            - arm64-v8a only. Sideload: enable "Install unknown apps", then open the APK.
          files: ${{ steps.apk.outputs.path }}
