name: Android Release APK

# Builds a signed release APK every time code lands on `main` and publishes it
# to a rolling GitHub Release (tag: android-latest).
#
# One-time setup — add these repo secrets
# (Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret):
#   ANDROID_KEYSTORE_BASE64      base64 of your release.keystore file
#   ANDROID_KEYSTORE_PASSWORD    store password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of google-services.json (Firebase console
#                                 ▸ Project settings ▸ your Android app)
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID   optional build notification (see below)
#
#   base64 -w0 google-services.json   # value for GOOGLE_SERVICES_JSON_BASE64 (Linux/macOS)
#   # PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("google-services.json"))
#
# Generate the keystore once (back up the file + passwords — losing them means
# users can no longer update-install over an existing build):
#   keytool -genkeypair -v -keystore release.keystore -alias goku \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -storepass '<STORE_PW>' -keypass '<KEY_PW>' -dname "CN=Goku,O=NIGO,C=IN"
#   base64 -w0 release.keystore    # value for ANDROID_KEYSTORE_BASE64 (Linux/macOS)
#   # PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore"))
#
# The release signing config itself is injected at prebuild time by
# plugins/withReleaseSigning.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Set Android versionCode to run number
        run: |
          node -e '
            const fs = require("fs");
            const p = "app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("expo.android.versionCode =", j.expo.android.versionCode);
          '

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json
          test -s google-services.json || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing or empty"; exit 1; }

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Show generated version
        run: grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty"; exit 1; }

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Verify APK is signed with the release key
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | head -n 5

      - name: Prepare APK
        id: apk
        run: |
          set -e
          version=$(node -p "require('./app.json').expo.version")
          src=android/app/build/outputs/apk/release/app-release.apk
          dest="Goku-v${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Trim old APKs (keep the previous build alongside the new one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Delete every APK except the newest existing one; the upload below
          # then adds the current build, leaving the release with two:
          # previous + latest. To retain more, widen the slice
          # (.[1:] -> .[2:] keeps two old builds, etc.).
          stale=$(gh release view android-latest --json assets \
                    --jq '[.assets[] | select(.name | endswith(".apk"))]
                          | sort_by(.createdAt) | reverse | .[1:] | .[].name' \
                    2>/dev/null || true)
          if [ -z "$stale" ]; then
            echo "Nothing to trim."
          else
            echo "$stale" | while read -r asset; do
              echo "Deleting old asset: $asset"
              gh release delete-asset android-latest "$asset" --yes
            done
          fi

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated build from `main` @ ${{ github.sha }}

            - App version: **${{ steps.apk.outputs.version }}** (versionCode ${{ github.run_number }})
            - arm64-v8a only. Sideload: enable "Install unknown apps", then open the APK.
          files: ${{ steps.apk.outputs.path }}

      # Ping me when a build ships. Optional — skipped unless the two secrets
      # exist. One-time setup:
      #   1. Telegram → message @BotFather → /newbot → copy the bot token.
      #   2. Message your new bot once (so it may DM you), then open
      #      https://api.telegram.org/bot<TOKEN>/getUpdates and copy
      #      "chat":{"id": ...} — or message @userinfobot for your numeric id.
      #   3. Repo ▸ Settings ▸ Secrets and variables ▸ Actions → add
      #      TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
      - name: Notify me on Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.apk.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping notification."
            exit 0
          fi

          caption=$(printf '%s\n' \
            "🟢 New Goku Android build is live" \
            "" \
            "Version $VERSION (build $RUN_NUMBER)" \
            "Commit ${COMMIT:0:7}")

          # Telegram bots can only upload files up to 50MB; send the APK itself
          # when it fits, otherwise fall back to a message with the download link.
          size=$(stat -c%s "$APK")
          limit=$((49 * 1024 * 1024))
          if [ "$size" -le "$limit" ]; then
            echo "Sending APK as a document ($((size / 1024 / 1024)) MB)"
            curl -sS --fail \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "caption=$caption" \
              -F "document=@$APK"
          else
            echo "APK is $((size / 1024 / 1024)) MB — over Telegram's 50MB upload limit, sending a link instead"
            text=$(printf '%s\n%s\n' "$caption" "" \
              "Install: https://github.com/$REPO/releases/tag/android-latest")
            curl -sS --fail \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$text" \
              --data-urlencode "disable_web_page_preview=true"
          fi
